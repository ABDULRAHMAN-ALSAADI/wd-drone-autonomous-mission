name: Feature request
description: Suggest a focused, testable improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: Explain the user need before describing a solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true
  - type: textarea
    id: testing
    attributes:
      label: How could this be tested?
      description: Mention unit tests, simulation, and hardware tests as applicable.
    validations:
      required: true
  - type: dropdown
    id: safety_impact
    attributes:
      label: Does this affect flight or payload behavior?
      options:
        - "No"
        - "Yes"
        - "Unsure"
    validations:
      required: true
